  <!-- 화면 가득 차는 16:9 정보 팝업 (모달) -->
  <div id="heroModal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalTitle" class="modal-title">영웅 정보</span>
        <button class="close-btn" onclick="closeModal()" aria-label="닫기">&times;</button>
      </div>
      <div class="aspect-16-9">
        <img id="modalImg" src="" alt="영웅 상세 정보">
      </div>
    </div>
  </div>

  <script>
    function openModal(imgSrc, name) {
      const modal = document.getElementById('heroModal');
      const modalImg = document.getElementById('modalImg');
      const modalTitle = document.getElementById('modalTitle');
      
      modalImg.src = imgSrc;
      modalTitle.innerText = name;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
    }

    function closeModal() {
      const modal = document.getElementById('heroModal');
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // 필터링 기능
    const tabs = document.querySelectorAll('.tab-btn');
    const cards = document.querySelectorAll('.hero-card');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const filter = tab.getAttribute('data-filter');

        cards.forEach(card => {
          if (filter === 'all' || card.getAttribute('data-expansion') === filter) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });
  </script>
